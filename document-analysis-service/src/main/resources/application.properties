spring.application.name=document-analysis-service

# API Service URL
api.service.base-url=http://api-service:8080

# Redis Configuration
spring.data.redis.host=redis-stack
spring.data.redis.port=6379

# Add this line for Spring AI specifically
spring.ai.vectorstore.redis.uri=redis://redis-stack:6379

# Spring AI Ollama Configuration
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=mistral

# Spring AI Redis Vector Store Configuration
spring.ai.vectorstore.redis.index=document-analysis-index
spring.ai.vectorstore.redis.prefix=document-analysis:
